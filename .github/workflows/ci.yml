name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets

  node:
    name: Node workspace
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BASKET_RETURNS_TEST_DATABASE_URL: postgres://basalt_ci:basalt_ci_test_only@127.0.0.1:5432/basalt_ci_test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: basalt_ci
          POSTGRES_PASSWORD: basalt_ci_test_only
          POSTGRES_DB: basalt_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U basalt_ci -d basalt_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean workspace install
        run: npm ci --ignore-scripts --legacy-peer-deps=false
      - name: Generate deployment manifest
        env:
          SOURCE_DATE_EPOCH: "0"
        run: npm run manifest -- --environment ci --cluster devnet --no-elf --output /tmp/basalt-deployment-manifest.json
      - name: Build backend
        run: npm --prefix backend run build
      - name: Test backend
        run: npm --prefix backend test -- --run
      - name: Test security guards and dependency compatibility
        run: npm run test:security && node scripts/security/dependency-smoke.mjs
      - name: Test app
        run: npm --prefix app test
      - name: Typecheck app
        run: npm --prefix app run typecheck
      - name: Build app
        run: npm --prefix app run build
      - name: Check patch hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi

  backend-container:
    name: Backend Node 20 container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Build backend image from restricted repository context
        run: docker build --file backend/Dockerfile --tag basalt-backend:ci .
      - name: Load production dependencies without network or application startup
        run: >-
          docker run --rm --network none --read-only --entrypoint node basalt-backend:ci -e
          "const assert=require('node:assert/strict');
          assert.equal(process.versions.node.split('.')[0],'20');
          assert.equal(require('/usr/local/lib/node_modules/npm/package.json').version,'11.6.2');
          for(const name of ['@solana/web3.js','@solana/spl-token','pg']) require(name);
          assert.equal(require('bigint-buffer/package.json').name,'@basalt/bigint-buffer');
          assert.equal(require('bigint-buffer/package.json').version,'1.0.0');
          assert.equal(require('bigint-buffer').toBigIntLE(Buffer.from([1])),1n);
          assert.ok(require('node:fs').existsSync('dist/db/schema.sql'));"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Block high workspace advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Block high app advisories
        run: npm --prefix app audit --omit=dev --audit-level=high --workspaces=false
      - name: Block high backend advisories
        run: npm --prefix backend audit --omit=dev --audit-level=high --workspaces=false

  rust-dependency-audit:
    name: Rust dependency reachability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --version 0.22.0 --locked
      - name: Block unknown, changed or expired RustSec findings
        run: node scripts/security/audit-rust.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Check historical Solana keypairs and permanent retirement inventory
        run: node scripts/security/check-secret-history.mjs
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
