[workspace]
members = [
    "crates/token-policy",
    "scripts/security/rust-parent-verification",
    "programs/whitelist",
    "programs/basket_factory",
    "programs/basket",
    "programs/managed_basket"
]
resolver = "2"

[profile.release]
overflow-checks = true

[workspace.dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
spl-associated-token-account = "4.0.0"
spl-token-2022 = "3.0.5"
thiserror = "1.0"

basalt-token-policy = { path = "crates/token-policy" }

# Narrow host dependency fixes; upstream Rust sources are byte-identical.
# See vendor/rust/README.md and the fail-closed provenance verifier.
[patch.crates-io]
solana-logger = { path = "vendor/rust/solana-logger-1.18.26" }
solana-sdk = { path = "vendor/rust/solana-sdk-1.18.26" }
solana-frozen-abi = { path = "vendor/rust/solana-frozen-abi-1.18.26" }
