[package]
name = "managed_basket"
version = "0.1.0"
description = "Basalt Managed Basket V2 two-asset mock prototype"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "managed_basket"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Local validator smoke tests only. Never enable this feature in a deployed build.
localnet-fast-notice = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
